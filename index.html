<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Shift Delivery - 3D Isometric</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
    }

    canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    #joystick {
        position: fixed;
        bottom: 60px;
        left: 60px;
        width: 140px;
        height: 140px;
        background: rgba(255, 255, 255, 0.12);
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        z-index: 100;
    }

    #joystickStick {
        position: absolute;
        width: 55px;
        height: 55px;
        background: rgba(100, 150, 255, 0.75);
        border: 3px solid rgba(150, 200, 255, 0.95);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: none;
    }
</style>
</head>
<body>

    <!-- Virtual Joystick -->
    <div id="joystick">
        <div id="joystickStick"></div>
    </div>

    <!-- Three.js via CDN (MUST load before game.js) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <script src="game.js"></script>
</body>
</html>
