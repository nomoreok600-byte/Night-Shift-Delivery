<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open World 3D - Third Person</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
        font-family: -apple-system, system-ui, sans-serif;
    }

    canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    /* --- CROSSHAIR --- */
    #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        z-index: 90;
        pointer-events: none;
        opacity: 0.85;
    }
    #crosshair::before,
    #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        box-shadow: 0 0 3px rgba(0,0,0,0.9);
    }
    #crosshair::before {
        top: 50%; left: 0;
        width: 100%; height: 2px;
        margin-top: -1px;
    }
    #crosshair::after {
        left: 50%; top: 0;
        width: 2px; height: 100%;
        margin-left: -1px;
    }
    #crosshair.hidden { display: none; }

    #hitmarker {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 34px;
        height: 34px;
        transform: translate(-50%, -50%) rotate(45deg);
        border: 3px solid #ff3b3b;
        border-radius: 4px;
        z-index: 91;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease-out;
    }
    #hitmarker.show { opacity: 1; }

    /* --- HUD --- */
    #hud {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 95;
        text-align: right;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        pointer-events: none;
    }
    #ammo {
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    #ammo .mag { font-size: 15px; opacity: 0.7; }
    #kills {
        font-size: 13px;
        opacity: 0.8;
        margin-top: 4px;
    }
    #speedo {
        font-size: 15px;
        opacity: 0.9;
        margin-top: 6px;
        display: none;
    }

    /* --- JOYSTICK --- */
    #joystick {
        position: fixed;
        bottom: 80px;
        left: 80px;
        width: 150px;
        height: 150px;
        background: rgba(255, 255, 255, 0.1);
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        z-index: 100;
        touch-action: none;
    }

    #joystickStick {
        position: absolute;
        width: 60px;
        height: 60px;
        background: rgba(100, 150, 255, 0.7);
        border: 3px solid rgba(150, 200, 255, 0.9);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    #cameraControl {
        position: fixed;
        top: 0;
        right: 0;
        width: 50%;
        height: 100%;
        z-index: 50;
        touch-action: none;
    }

    /* --- ACTION BUTTONS --- */
    #actionButtons {
        position: fixed;
        bottom: 60px;
        right: 60px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-gap: 15px;
        z-index: 100;
    }

    .actionButton {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 3px solid rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        touch-action: none;
        transition: transform 0.08s ease, background 0.08s ease;
    }

    .actionButton:active,
    .actionButton.active {
        background: rgba(100, 150, 255, 0.5);
        border-color: rgba(150, 200, 255, 0.8);
        transform: scale(0.94);
    }

    #btnRun   { background: rgba(100, 255, 150, 0.15); border-color: rgba(100, 255, 150, 0.4); }
    #btnJump  { background: rgba(255, 200, 100, 0.15); border-color: rgba(255, 200, 100, 0.4); }
    #btnFire  { background: rgba(255, 100, 100, 0.15); border-color: rgba(255, 100, 100, 0.4); }
    #btnReload{ background: rgba(200, 150, 255, 0.15); border-color: rgba(200, 150, 255, 0.4); }

    #btnRun.active  { background: rgba(100, 255, 150, 0.5); }
    #btnFire.active { background: rgba(255, 100, 100, 0.5); }

    /* --- VEHICLE BUTTON --- */
    #btnCar {
        position: fixed;
        bottom: 165px;
        right: 72px;
        width: 92px;
        height: 46px;
        border-radius: 23px;
        background: rgba(255, 230, 100, 0.25);
        border: 3px solid rgba(255, 230, 100, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        z-index: 101;
        touch-action: none;
    }
    #btnCar.visible { display: flex; }
    #btnCar:active { transform: scale(0.94); background: rgba(255, 230, 100, 0.5); }

    /* Buttons hidden while driving */
    body.driving #btnRun,
    body.driving #btnJump,
    body.driving #btnFire,
    body.driving #btnReload { display: none; }
</style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hitmarker"></div>

    <div id="hud">
        <div id="ammo">30<span class="mag"> / 30</span></div>
        <div id="kills">KILLS 0</div>
        <div id="speedo">0 km/h</div>
    </div>

    <div id="joystick">
        <div id="joystickStick"></div>
    </div>

    <div id="cameraControl"></div>

    <div id="btnCar">ENTER</div>

    <div id="actionButtons">
        <div class="actionButton" id="btnRun">RUN</div>
        <div class="actionButton" id="btnJump">JUMP</div>
        <div class="actionButton" id="btnFire">FIRE</div>
        <div class="actionButton" id="btnReload">RELOAD</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="game.js"></script>
</body>
</html>
